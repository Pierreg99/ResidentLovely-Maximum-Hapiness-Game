<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="dungeonSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#05070a" />
      <stop offset="50%" stop-color="#2d150b" />
      <stop offset="100%" stop-color="#0a0503" />
    </linearGradient>
    <linearGradient id="potionEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="potionViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#581c87" />
    </linearGradient>
    <linearGradient id="stoneArch" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="50%" stop-color="#44403c" />
      <stop offset="100%" stop-color="#1c1917" />
    </linearGradient>
    <radialGradient id="brazierGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#ef4444" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="potionGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#10b981" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#05070a" stop-opacity="0" />
    </radialGradient>
    <filter id="alchemyBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Dungeon Wall -->
  <rect width="1920" height="1080" fill="url(#dungeonSky)" />

  <!-- Massive Romanesque Vault Arches & Columns -->
  <g stroke="#78350f" stroke-width="4" fill="none">
    <path d="M 200,1080 L 200,450 Q 960,100 1720,450 L 1720,1080" />
    <path d="M 380,1080 L 380,520 Q 960,220 1540,520 L 1540,1080" />
    <path d="M 560,1080 L 560,590 Q 960,340 1360,590 L 1360,1080" />
  </g>

  <!-- Hanging Iron Dungeon Chains -->
  <g stroke="#44403c" stroke-width="3" stroke-dasharray="8 6" opacity="0.7">
    <line x1="380" y1="0" x2="380" y2="480" />
    <line x1="620" y1="0" x2="620" y2="420" />
    <line x1="1300" y1="0" x2="1300" y2="420" />
    <line x1="1540" y1="0" x2="1540" y2="480" />
  </g>

  <!-- Glowing Hanging Braziers (Left & Right) -->
  <g filter="url(#alchemyBlur)">
    <!-- Left Brazier Fire -->
    <circle cx="380" cy="480" r="140" fill="url(#brazierGlow)" />
    <polygon points="350,480 410,480 395,530 365,530" fill="#1c1917" stroke="#f59e0b" stroke-width="2" />
    <polygon points="360,475 380,420 400,475" fill="#fef08a" />

    <!-- Right Brazier Fire -->
    <circle cx="1540" cy="480" r="140" fill="url(#brazierGlow)" />
    <polygon points="1510,480 1570,480 1555,530 1525,530" fill="#1c1917" stroke="#f59e0b" stroke-width="2" />
    <polygon points="1520,475 1540,420 1560,475" fill="#fef08a" />
  </g>

  <!-- Alchemist Workstation & Distillation Alembic Glassware (Center) -->
  <!-- Large Heavy Stone Altar Table -->
  <polygon points="580,720 1340,720 1420,860 500,860" fill="url(#stoneArch)" stroke="#78350f" stroke-width="3" />
  <rect x="540" y="860" width="80" height="220" fill="#1c1917" stroke="#292524" stroke-width="2" />
  <rect x="1300" y="860" width="80" height="220" fill="#1c1917" stroke="#292524" stroke-width="2" />

  <!-- Giant Boiling Retort & Flask (Center Alchemical Vessel) -->
  <g filter="url(#alchemyBlur)">
    <circle cx="960" cy="620" r="160" fill="url(#potionGlow)" />
    <!-- Glass Boiling Flask -->
    <ellipse cx="960" cy="650" rx="90" ry="75" fill="url(#potionEmerald)" opacity="0.85" />
    <rect x="940" y="520" width="40" height="80" fill="#a7f3d0" opacity="0.6" stroke="#34d399" stroke-width="2" />
    <ellipse cx="960" cy="520" rx="25" ry="8" fill="#d1fae5" />
    <!-- Bubbling Liquid Bubbles -->
    <circle cx="930" cy="640" r="8" fill="#ffffff" />
    <circle cx="970" cy="670" r="12" fill="#ffffff" />
    <circle cx="950" cy="610" r="6" fill="#ffffff" />
    <circle cx="990" cy="630" r="10" fill="#ffffff" />
  </g>

  <!-- Secondary Flasks on Altar (Left: Amethyst, Right: Amber) -->
  <g filter="url(#alchemyBlur)">
    <!-- Purple Flask Left -->
    <polygon points="760,715 780,630 820,630 840,715" fill="url(#potionViolet)" opacity="0.85" stroke="#c084fc" stroke-width="2" />
    <rect x="790" y="590" width="20" height="40" fill="#e9d5ff" opacity="0.6" />

    <!-- Amber Flask Right -->
    <ellipse cx="1140" cy="670" rx="35" ry="45" fill="#f59e0b" opacity="0.85" stroke="#fef08a" stroke-width="2" />
    <rect x="1130" y="595" width="20" height="35" fill="#fef3c7" opacity="0.6" />
  </g>

  <!-- Distillation Glass Tubes Linking Vessels -->
  <path d="M 800,590 Q 880,480 960,520 Q 1040,480 1140,595" fill="none" stroke="#6ee7b7" stroke-width="3" opacity="0.8" />

  <!-- Runed Cobblestone Dungeon Floor -->
  <polygon points="0,1080 380,860 1540,860 1920,1080" fill="#140904" />
  <g stroke="#78350f" stroke-width="1.5" opacity="0.4">
    <line x1="960" y1="860" x2="960" y2="1080" />
    <line x1="720" y1="860" x2="480" y2="1080" />
    <line x1="1200" y1="860" x2="1440" y2="1080" />
    <line x1="500" y1="930" x2="1420" y2="930" />
    <line x1="380" y1="1010" x2="1540" y2="1010" />
  </g>

  <!-- Glowing Transmutation Circle Runes on Floor -->
  <g stroke="#10b981" stroke-width="2" fill="none" filter="url(#alchemyBlur)" opacity="0.75">
    <ellipse cx="960" cy="980" rx="360" ry="75" />
    <ellipse cx="960" cy="980" rx="280" ry="58" stroke="#a855f7" stroke-dasharray="12 12" />
    <!-- Triangle in Circle -->
    <polygon points="960,922 1230,1005 690,1005" stroke="#f59e0b" />
  </g>
</svg>
