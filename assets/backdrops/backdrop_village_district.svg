<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="villageSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#78350f" />
      <stop offset="85%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="cottageWall" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <radialGradient id="lampWarmGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.9" />
      <stop offset="35%" stop-color="#f59e0b" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>
    <filter id="villageBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Sunset Sky -->
  <rect width="1920" height="700" fill="url(#villageSky)" />

  <!-- Distant Windmill & Rolling Hillside -->
  <path d="M 0,560 Q 480,480 960,540 Q 1440,460 1920,550 L 1920,700 L 0,700 Z" fill="#064e3b" />
  
  <!-- Thatched Cottages Silhouettes (Left & Right) -->
  <!-- Left Thatched Cottage -->
  <g fill="url(#cottageWall)" stroke="#0f172a" stroke-width="2">
    <!-- Walls -->
    <polygon points="120,780 120,480 340,360 560,480 560,780" />
    <!-- Thatched Roof -->
    <polygon points="80,500 340,320 600,500 540,500 340,360 140,500" fill="#78350f" stroke="#451a03" stroke-width="3" />
    <!-- Timber Cross Beams -->
    <line x1="120" y1="600" x2="560" y2="600" stroke="#0f172a" stroke-width="4" />
    <line x1="120" y1="480" x2="560" y2="780" stroke="#0f172a" stroke-width="3" />
    <line x1="560" y1="480" x2="120" y2="780" stroke="#0f172a" stroke-width="3" />
    <!-- Glowing Window -->
    <rect x="280" y="520" width="120" height="70" rx="6" fill="#fef08a" opacity="0.85" stroke="#f59e0b" stroke-width="2" filter="url(#villageBlur)" />
  </g>

  <!-- Right Thatched Cottage -->
  <g fill="url(#cottageWall)" stroke="#0f172a" stroke-width="2">
    <polygon points="1360,780 1360,480 1580,360 1800,480 1800,780" />
    <polygon points="1320,500 1580,320 1840,500 1780,500 1580,360 1380,500" fill="#78350f" stroke="#451a03" stroke-width="3" />
    <line x1="1360" y1="600" x2="1800" y2="600" stroke="#0f172a" stroke-width="4" />
    <rect x="1520" y="520" width="120" height="70" rx="6" fill="#fef08a" opacity="0.85" stroke="#f59e0b" stroke-width="2" filter="url(#villageBlur)" />
  </g>

  <!-- Center Village Cobblestone Well & Lamppost -->
  <!-- Stone Well -->
  <ellipse cx="960" cy="800" rx="140" ry="40" fill="#1e293b" stroke="#0f172a" stroke-width="3" />
  <ellipse cx="960" cy="790" rx="120" ry="32" fill="#0f172a" />
  <rect x="840" y="800" width="240" height="90" fill="#334155" stroke="#0f172a" stroke-width="3" />
  <ellipse cx="960" cy="890" rx="140" ry="40" fill="#1e293b" stroke="#0f172a" stroke-width="3" />

  <!-- Well Roof Structure -->
  <line x1="860" y1="780" x2="860" y2="600" stroke="#78350f" stroke-width="6" />
  <line x1="1060" y1="780" x2="1060" y2="600" stroke="#78350f" stroke-width="6" />
  <polygon points="820,620 960,520 1100,620" fill="#451a03" stroke="#0f172a" stroke-width="3" />

  <!-- Warm Village Street Lantern (Left Flank) -->
  <g filter="url(#villageBlur)">
    <circle cx="680" cy="580" r="100" fill="url(#lampWarmGlow)" />
    <rect x="676" y="600" width="8" height="190" fill="#0f172a" />
    <polygon points="665,600 695,600 690,565 670,565" fill="#fef08a" stroke="#f59e0b" stroke-width="2" />
  </g>

  <!-- Cobblestone Village Square Ground -->
  <polygon points="0,1080 0,820 1920,820 1920,1080" fill="#1c1917" />
  <g stroke="#f59e0b" stroke-width="1" opacity="0.3">
    <line x1="960" y1="820" x2="960" y2="1080" />
    <line x1="680" y1="820" x2="400" y2="1080" />
    <line x1="1240" y1="820" x2="1520" y2="1080" />
    <line x1="0" y1="900" x2="1920" y2="900" />
    <line x1="0" y1="980" x2="1920" y2="980" />
    <line x1="0" y1="1050" x2="1920" y2="1050" />
  </g>
</svg>
