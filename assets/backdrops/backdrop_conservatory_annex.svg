<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="gothicNightSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#05070a" />
      <stop offset="40%" stop-color="#1e0b36" />
      <stop offset="80%" stop-color="#3b0764" />
      <stop offset="100%" stop-color="#090514" />
    </linearGradient>
    <linearGradient id="ghostlyMist" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#7c3aed" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#05070a" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="thornyVines" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#4c1d95" />
      <stop offset="100%" stop-color="#0f0728" />
    </linearGradient>
    <radialGradient id="ghostOrb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e9d5ff" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#a855f7" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#05070a" stop-opacity="0" />
    </radialGradient>
    <filter id="gothicBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Night Sky Outside Broken Glass Dome -->
  <rect width="1920" height="1080" fill="url(#gothicNightSky)" />

  <!-- Ghostly Violet Atmospheric Fog / Aura -->
  <circle cx="960" cy="540" r="620" fill="url(#ghostOrb)" />

  <!-- Victorian Wrought-Iron Conservatory Glass Dome Arch Ribs -->
  <g stroke="#3b0764" stroke-width="4" fill="none">
    <!-- Center Grand Arch -->
    <path d="M 300,1080 L 300,450 Q 960,80 1620,450 L 1620,1080" />
    <!-- Secondary Arches -->
    <path d="M 450,1080 L 450,520 Q 960,200 1470,520 L 1470,1080" />
    <path d="M 600,1080 L 600,600 Q 960,320 1320,600 L 1320,1080" />

    <!-- Dome Rib Radial Lines to Apex -->
    <line x1="960" y1="80" x2="300" y2="450" />
    <line x1="960" y1="80" x2="450" y2="520" />
    <line x1="960" y1="80" x2="600" y2="600" />
    <line x1="960" y1="80" x2="960" y2="700" />
    <line x1="960" y1="80" x2="1320" y2="600" />
    <line x1="960" y1="80" x2="1470" y2="520" />
    <line x1="960" y1="80" x2="1620" y2="450" />
  </g>

  <!-- Broken Glass Panes Shimmer in Night Sky -->
  <g fill="#c084fc" opacity="0.15">
    <polygon points="400,480 480,440 440,540" />
    <polygon points="1440,460 1520,500 1460,560" />
    <polygon points="860,240 940,200 900,300" />
    <polygon points="1020,220 1080,260 1000,310" />
  </g>

  <!-- Overgrown Creeping Thorny Black Vines & Withered Foliage -->
  <g stroke="url(#thornyVines)" stroke-width="6" fill="none" stroke-linecap="round">
    <!-- Left Creeping Vine Tendril -->
    <path d="M 0,900 Q 200,800 280,640 Q 320,480 260,340 Q 380,240 460,360 Q 520,480 600,420" />
    <!-- Thorns on Left Vine -->
    <path d="M 270,660 L 290,640" stroke="#7c3aed" stroke-width="4" />
    <path d="M 310,500 L 335,490" stroke="#7c3aed" stroke-width="4" />
    <path d="M 270,360 L 250,340" stroke="#7c3aed" stroke-width="4" />
    <path d="M 440,340 L 465,320" stroke="#7c3aed" stroke-width="4" />

    <!-- Right Creeping Vine Tendril -->
    <path d="M 1920,900 Q 1720,800 1640,640 Q 1600,480 1660,340 Q 1540,240 1460,360 Q 1400,480 1320,420" />
    <path d="M 1650,660 L 1630,640" stroke="#7c3aed" stroke-width="4" />
    <path d="M 1610,500 L 1585,490" stroke="#7c3aed" stroke-width="4" />
    <path d="M 1650,360 L 1670,340" stroke="#7c3aed" stroke-width="4" />
  </g>

  <!-- Ghostly Withered Victorian Topiary & Stone Urns (Midground) -->
  <g fill="#1e1b4b" stroke="#7c3aed" stroke-width="2">
    <!-- Left Withered Urn & Topiary Arch -->
    <polygon points="400,800 480,800 460,720 420,720" fill="#0f0728" />
    <ellipse cx="440" cy="710" rx="35" ry="15" fill="#2e1065" />
    <path d="M 440,700 Q 400,580 440,500 Q 480,580 440,700 Z" fill="#3b0764" />

    <!-- Right Withered Urn & Topiary Arch -->
    <polygon points="1440,800 1520,800 1500,720 1460,720" fill="#0f0728" />
    <ellipse cx="1480" cy="710" rx="35" ry="15" fill="#2e1065" />
    <path d="M 1480,700 Q 1440,580 1480,500 Q 1520,580 1480,700 Z" fill="#3b0764" />
  </g>

  <!-- Floating Phantom Will-o'-the-Wisps / Ghostly Motes -->
  <g filter="url(#gothicBlur)">
    <circle cx="440" cy="480" r="16" fill="url(#ghostOrb)" />
    <circle cx="1480" cy="480" r="16" fill="url(#ghostOrb)" />
    <circle cx="760" cy="420" r="12" fill="url(#ghostOrb)" />
    <circle cx="1160" cy="420" r="12" fill="url(#ghostOrb)" />
    <circle cx="960" cy="340" r="18" fill="url(#ghostOrb)" />
  </g>

  <!-- Dilapidated Flagstone Conservatory Floor -->
  <polygon points="0,1080 300,800 1620,800 1920,1080" fill="#090514" />
  <g stroke="#7c3aed" stroke-width="1.5" opacity="0.4">
    <line x1="960" y1="800" x2="960" y2="1080" />
    <line x1="720" y1="800" x2="480" y2="1080" />
    <line x1="1200" y1="800" x2="1440" y2="1080" />
    <line x1="480" y1="800" x2="100" y2="1080" />
    <line x1="1440" y1="800" x2="1820" y2="1080" />
    <line x1="450" y1="880" x2="1470" y2="880" />
    <line x1="320" y1="970" x2="1600" y2="970" />
  </g>

  <!-- Cracks on Conservatory Floor -->
  <g stroke="#a855f7" stroke-width="2" fill="none" opacity="0.7">
    <path d="M 720,840 L 760,890 L 730,940 L 780,1020" />
    <path d="M 1200,850 L 1170,910 L 1220,980 L 1190,1050" />
  </g>
</svg>
