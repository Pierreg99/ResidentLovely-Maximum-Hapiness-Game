<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="salonWall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#180c1e" />
      <stop offset="50%" stop-color="#3b1137" />
      <stop offset="100%" stop-color="#1a0818" />
    </linearGradient>
    <linearGradient id="roseVelvet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="50%" stop-color="#db2777" />
      <stop offset="100%" stop-color="#831843" />
    </linearGradient>
    <linearGradient id="teaGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <radialGradient id="chandelierGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbcfe8" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#f472b6" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#3b1137" stop-opacity="0" />
    </radialGradient>
    <filter id="teaBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Salon Wall -->
  <rect width="1920" height="1080" fill="url(#salonWall)" />

  <!-- Victorian Arched Windows (Background) -->
  <g stroke="url(#teaGold)" stroke-width="3" fill="#2a0826" opacity="0.85">
    <!-- Left Arched Window -->
    <path d="M 280,680 L 280,320 Q 420,180 560,320 L 560,680 Z" />
    <line x1="420" y1="250" x2="420" y2="680" />
    <line x1="280" y1="450" x2="560" y2="450" />
    <path d="M 330,450 Q 420,360 510,450" fill="none" />

    <!-- Center Arched French Door Frame -->
    <path d="M 800,750 L 800,240 Q 960,100 1120,240 L 1120,750 Z" />
    <line x1="960" y1="170" x2="960" y2="750" />
    <line x1="800" y1="380" x2="1120" y2="380" />
    <line x1="800" y1="560" x2="1120" y2="560" />

    <!-- Right Arched Window -->
    <path d="M 1360,680 L 1360,320 Q 1500,180 1640,320 L 1640,680 Z" />
    <line x1="1500" y1="250" x2="1500" y2="680" />
    <line x1="1360" y1="450" x2="1640" y2="450" />
    <path d="M 1410,450 Q 1500,360 1590,450" fill="none" />
  </g>

  <!-- Velvet Drapery & Swags -->
  <g fill="url(#roseVelvet)" stroke="#500724" stroke-width="2">
    <!-- Left Drapes -->
    <path d="M 180,0 Q 240,400 200,700 Q 270,720 300,0 Z" />
    <!-- Center Valance Swag -->
    <path d="M 700,120 Q 960,220 1220,120 Q 960,80 700,120 Z" />
    <!-- Right Drapes -->
    <path d="M 1740,0 Q 1680,400 1720,700 Q 1650,720 1620,0 Z" />
  </g>

  <!-- Grand Rose Crystal Chandelier (Center Top) -->
  <g filter="url(#teaBlur)">
    <circle cx="960" cy="180" r="160" fill="url(#chandelierGlow)" />
    <!-- Chain -->
    <line x1="960" y1="0" x2="960" y2="120" stroke="url(#teaGold)" stroke-width="3" />
    <!-- Chandelier Torus Tiers -->
    <ellipse cx="960" cy="140" rx="100" ry="16" fill="none" stroke="url(#teaGold)" stroke-width="4" />
    <ellipse cx="960" cy="180" rx="60" ry="10" fill="none" stroke="url(#teaGold)" stroke-width="3" />
    <!-- Hanging Crystals -->
    <polygon points="880,150 885,190 880,210 875,190" fill="#fbcfe8" />
    <polygon points="920,150 925,200 920,220 915,200" fill="#fbcfe8" />
    <polygon points="960,190 965,250 960,280 955,250" fill="#fbcfe8" />
    <polygon points="1000,150 1005,200 1000,220 995,200" fill="#fbcfe8" />
    <polygon points="1040,150 1045,190 1040,210 1035,190" fill="#fbcfe8" />
  </g>

  <!-- Elegant Checkerboard Marble Floor -->
  <polygon points="0,1080 300,750 1620,750 1920,1080" fill="#1c0719" />
  <g stroke="url(#roseVelvet)" stroke-width="1.5" opacity="0.4">
    <line x1="960" y1="750" x2="960" y2="1080" />
    <line x1="740" y1="750" x2="520" y2="1080" />
    <line x1="1180" y1="750" x2="1400" y2="1080" />
    <line x1="520" y1="750" x2="100" y2="1080" />
    <line x1="1400" y1="750" x2="1820" y2="1080" />
    <line x1="450" y1="830" x2="1470" y2="830" />
    <line x1="340" y1="920" x2="1580" y2="920" />
    <line x1="180" y1="1010" x2="1740" y2="1010" />
  </g>

  <!-- Kawaii Tea Table & Tiered Stand (Center Stage) -->
  <g stroke="url(#teaGold)" stroke-width="2">
    <!-- Table Pedestal & Top -->
    <ellipse cx="960" cy="850" rx="220" ry="45" fill="#4a0e44" />
    <ellipse cx="960" cy="840" rx="200" ry="38" fill="#701a67" />
    <rect x="948" y="850" width="24" height="150" fill="#2a0826" />
    <ellipse cx="960" cy="1000" rx="100" ry="20" fill="#1a0418" />

    <!-- 3-Tier Pastry Stand -->
    <line x1="960" y1="640" x2="960" y2="830" stroke="url(#teaGold)" stroke-width="3" />
    <ellipse cx="960" cy="670" rx="40" ry="8" fill="#fdf2f8" />
    <ellipse cx="960" cy="720" rx="70" ry="12" fill="#fdf2f8" />
    <ellipse cx="960" cy="780" rx="100" ry="16" fill="#fdf2f8" />

    <!-- Porcelain Teapot & Delicate Cups -->
    <ellipse cx="840" cy="820" rx="18" ry="14" fill="#fdf2f8" />
    <path d="M 822,820 Q 805,805 818,795" fill="none" stroke="url(#teaGold)" stroke-width="2" />
    <ellipse cx="1080" cy="825" rx="16" ry="12" fill="#fdf2f8" />
  </g>

  <!-- Delicate Velvet Armchairs (Left & Right) -->
  <g fill="url(#roseVelvet)" stroke="#831843" stroke-width="2">
    <!-- Left Chaise -->
    <path d="M 450,780 Q 420,700 480,680 Q 560,680 580,780 Z" />
    <rect x="440" y="780" width="160" height="40" rx="10" />
    <line x1="460" y1="820" x2="450" y2="870" stroke="url(#teaGold)" stroke-width="3" />
    <line x1="580" y1="820" x2="590" y2="870" stroke="url(#teaGold)" stroke-width="3" />

    <!-- Right Chaise -->
    <path d="M 1340,780 Q 1360,680 1440,680 Q 1500,700 1470,780 Z" />
    <rect x="1320" y="780" width="160" height="40" rx="10" />
    <line x1="1340" y1="820" x2="1330" y2="870" stroke="url(#teaGold)" stroke-width="3" />
    <line x1="1460" y1="820" x2="1470" y2="870" stroke="url(#teaGold)" stroke-width="3" />
  </g>
</svg>
