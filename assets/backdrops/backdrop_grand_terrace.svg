<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="terraceSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="45%" stop-color="#0f172a" />
      <stop offset="75%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <radialGradient id="terraceMoon" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="35%" stop-color="#bae6fd" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="stoneBalustrade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="emeraldFlora" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <filter id="terraceGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Open Night Sky -->
  <rect width="1920" height="740" fill="url(#terraceSky)" />

  <!-- Giant Radiant Full Moon -->
  <g filter="url(#terraceGlow)">
    <circle cx="1060" cy="240" r="180" fill="url(#terraceMoon)" />
    <circle cx="1060" cy="240" r="70" fill="#f8fafc" />
  </g>

  <!-- Distant Mountain Ranges & Castle Turret Silhouettes -->
  <g fill="#070d18">
    <polygon points="0,580 320,440 680,590 0,590" />
    <polygon points="450,590 820,400 1200,590" />
    <polygon points="1050,590 1480,420 1920,590 1050,590" />
    <!-- Distant Spire Towers -->
    <polygon points="1620,590 1635,460 1650,460 1665,590" fill="#040810" />
    <polygon points="1630,460 1642,400 1655,460" fill="#040810" />
  </g>

  <!-- Floating Starlight Clusters -->
  <g fill="#ffffff" opacity="0.9">
    <circle cx="200" cy="120" r="2" />
    <circle cx="340" cy="180" r="2.5" />
    <circle cx="580" cy="90" r="1.5" />
    <circle cx="720" cy="200" r="3" />
    <circle cx="1380" cy="100" r="2.5" />
    <circle cx="1520" cy="160" r="2" />
    <circle cx="1780" cy="90" r="3" />
    <circle cx="1680" cy="250" r="1.5" />
  </g>

  <!-- Classical Pergola Arch Structure (Ceiling / Upper Frame) -->
  <g fill="#1e293b" stroke="#0f172a" stroke-width="2">
    <!-- Top Wooden Beams -->
    <rect x="0" y="0" width="1920" height="40" />
    <rect x="100" y="40" width="40" height="70" />
    <rect x="350" y="40" width="40" height="70" />
    <rect x="600" y="40" width="40" height="70" />
    <rect x="850" y="40" width="40" height="70" />
    <rect x="1100" y="40" width="40" height="70" />
    <rect x="1350" y="40" width="40" height="70" />
    <rect x="1600" y="40" width="40" height="70" />
    <rect x="1850" y="40" width="40" height="70" />
  </g>

  <!-- Hanging Wisteria Vines & Starlit Flora along Pergola -->
  <g fill="url(#emeraldFlora)" stroke="#064e3b" stroke-width="1.5">
    <path d="M 80,40 Q 120,220 90,340 Q 140,240 180,40 Z" />
    <path d="M 330,40 Q 380,260 340,380 Q 400,280 440,40 Z" />
    <path d="M 1580,40 Q 1540,240 1570,360 Q 1510,260 1480,40 Z" />
    <path d="M 1830,40 Q 1790,200 1810,320 Q 1760,220 1730,40 Z" />
  </g>

  <!-- Grand Classical Stone Balustrade (Midground Railing) -->
  <!-- Top Balustrade Rail -->
  <rect x="0" y="580" width="1920" height="35" fill="url(#stoneBalustrade)" stroke="#0f172a" stroke-width="3" />
  
  <!-- Baluster Columns -->
  <g fill="#1e293b" stroke="#0f172a" stroke-width="2">
    <!-- Repeating Balusters across view -->
    <rect x="80" y="615" width="22" height="155" rx="6" />
    <rect x="180" y="615" width="22" height="155" rx="6" />
    <rect x="280" y="615" width="22" height="155" rx="6" />
    <rect x="380" y="615" width="22" height="155" rx="6" />
    <rect x="480" y="615" width="22" height="155" rx="6" />
    <rect x="580" y="615" width="22" height="155" rx="6" />
    <rect x="680" y="615" width="22" height="155" rx="6" />
    <rect x="780" y="615" width="22" height="155" rx="6" />
    <rect x="880" y="615" width="22" height="155" rx="6" />
    <rect x="980" y="615" width="22" height="155" rx="6" />
    <rect x="1080" y="615" width="22" height="155" rx="6" />
    <rect x="1180" y="615" width="22" height="155" rx="6" />
    <rect x="1280" y="615" width="22" height="155" rx="6" />
    <rect x="1380" y="615" width="22" height="155" rx="6" />
    <rect x="1480" y="615" width="22" height="155" rx="6" />
    <rect x="1580" y="615" width="22" height="155" rx="6" />
    <rect x="1680" y="615" width="22" height="155" rx="6" />
    <rect x="1780" y="615" width="22" height="155" rx="6" />
  </g>

  <!-- Lower Balustrade Base -->
  <rect x="0" y="770" width="1920" height="40" fill="url(#stoneBalustrade)" stroke="#0f172a" stroke-width="3" />

  <!-- Grand Terrace Mosaic Stone Paver Floor -->
  <polygon points="0,1080 0,810 1920,810 1920,1080" fill="#0f172a" />
  <g stroke="#10b981" stroke-width="1.5" opacity="0.4">
    <line x1="960" y1="810" x2="960" y2="1080" />
    <line x1="720" y1="810" x2="480" y2="1080" />
    <line x1="1200" y1="810" x2="1440" y2="1080" />
    <line x1="480" y1="810" x2="0" y2="1080" />
    <line x1="1440" y1="810" x2="1920" y2="1080" />
    <line x1="0" y1="880" x2="1920" y2="880" />
    <line x1="0" y1="960" x2="1920" y2="960" />
    <line x1="0" y1="1040" x2="1920" y2="1040" />
  </g>

  <!-- Starlit Terrace Planters & Elegant Urns (Left & Right Corners) -->
  <g fill="url(#stoneBalustrade)" stroke="#047857" stroke-width="2">
    <!-- Left Urn -->
    <polygon points="120,810 180,810 165,710 135,710" />
    <ellipse cx="150" cy="710" rx="20" ry="8" fill="#10b981" />
    
    <!-- Right Urn -->
    <polygon points="1740,810 1800,810 1785,710 1755,710" />
    <ellipse cx="1770" cy="710" rx="20" ry="8" fill="#10b981" />
  </g>
</svg>
