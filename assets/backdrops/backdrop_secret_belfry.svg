<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="belfrySky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="35%" stop-color="#1e1b4b" />
      <stop offset="70%" stop-color="#831843" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="bronzeBell" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#78350f" />
      <stop offset="30%" stop-color="#d97706" />
      <stop offset="60%" stop-color="#fbbf24" />
      <stop offset="85%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>
    <linearGradient id="belfryTimber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0c0a09" />
      <stop offset="50%" stop-color="#1c1917" />
      <stop offset="100%" stop-color="#0c0a09" />
    </linearGradient>
    <radialGradient id="bellAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#f59e0b" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0" />
    </radialGradient>
    <filter id="belfryBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Dramatic Sunset & Midnight Sky View from Tower Top -->
  <rect width="1920" height="780" fill="url(#belfrySky)" />

  <!-- Distant Mountain Ridge & Sunset Horizon -->
  <g fill="#180828">
    <polygon points="0,680 400,560 850,700 0,700" />
    <polygon points="650,700 1100,540 1600,700" />
    <polygon points="1400,700 1750,580 1920,660 1920,700 1400,700" />
  </g>

  <!-- Open Gothic Belfry Arches Framing the Sky -->
  <g stroke="#0f172a" stroke-width="16" fill="none">
    <!-- Left Open Arch View -->
    <path d="M 120,780 L 120,380 Q 440,120 760,380 L 760,780" />
    <!-- Right Open Arch View -->
    <path d="M 1160,780 L 1160,380 Q 1480,120 1800,380 L 1800,780" />
  </g>

  <!-- Massive Interlocking Heavy Gearbox Assembly (Left & Right Flanks) -->
  <g fill="none" stroke="#d97706" stroke-width="8" opacity="0.8">
    <!-- Left Gear Mechanism -->
    <circle cx="280" cy="240" r="140" stroke-dasharray="20 12" />
    <circle cx="280" cy="240" r="70" stroke="#f59e0b" stroke-width="5" />
    <circle cx="160" cy="420" r="100" stroke-dasharray="16 10" stroke="#22d3ee" stroke-width="6" />

    <!-- Right Gear Mechanism -->
    <circle cx="1640" cy="240" r="140" stroke-dasharray="20 12" />
    <circle cx="1640" cy="240" r="70" stroke="#f59e0b" stroke-width="5" />
    <circle cx="1760" cy="420" r="100" stroke-dasharray="16 10" stroke="#22d3ee" stroke-width="6" />
  </g>

  <!-- Massive Heavy Timber Roof Truss & Belfry Beams -->
  <g fill="url(#belfryTimber)" stroke="#0c0a09" stroke-width="4">
    <!-- Horizontal Cross Beam Supporting Bell -->
    <rect x="0" y="80" width="1920" height="70" />
    <!-- Angled Knee Braces -->
    <polygon points="200,150 200,320 350,150" />
    <polygon points="1720,150 1720,320 1570,150" />
    <polygon points="760,150 760,300 890,150" />
    <polygon points="1160,150 1160,300 1030,150" />
  </g>

  <!-- Central Great Resonant Bronze Bell (Grand Focal Point) -->
  <g filter="url(#belfryBlur)">
    <circle cx="960" cy="460" r="220" fill="url(#bellAura)" />
    
    <!-- Heavy Iron Bell Yoke & Mounting Brackets -->
    <rect x="880" y="150" width="160" height="60" fill="#292524" stroke="#1c1917" stroke-width="3" rx="8" />
    <circle cx="960" cy="180" r="18" fill="#d97706" />

    <!-- Bell Crown & Shoulder -->
    <path d="M 890,210 Q 960,185 1030,210 L 1050,300 Q 960,285 870,300 Z" fill="url(#bronzeBell)" stroke="#451a03" stroke-width="3" />

    <!-- Main Bell Waist & Sound Bow (Flared Body) -->
    <path d="M 870,300 Q 820,480 720,620 Q 960,670 1200,620 Q 1100,480 1050,300 Z" fill="url(#bronzeBell)" stroke="#451a03" stroke-width="4" />

    <!-- Decorative Raised Bronze Inscription Bands & Runic Rings -->
    <path d="M 850,370 Q 960,355 1070,370" stroke="#fef08a" stroke-width="4" fill="none" />
    <path d="M 810,480 Q 960,460 1110,480" stroke="#fef08a" stroke-width="4" fill="none" />
    <path d="M 740,590 Q 960,570 1180,590" stroke="#fef08a" stroke-width="6" fill="none" />

    <!-- Heavy Bronze Clapper -->
    <circle cx="960" cy="650" r="35" fill="#451a03" stroke="#f59e0b" stroke-width="3" />
  </g>

  <!-- Belfry Timber Railing & Lookout Perch (Midground) -->
  <rect x="0" y="760" width="1920" height="30" fill="url(#belfryTimber)" stroke="#0c0a09" stroke-width="3" />
  
  <!-- Railing Balusters -->
  <g stroke="#1c1917" stroke-width="6">
    <line x1="140" y1="790" x2="140" y2="900" />
    <line x1="320" y1="790" x2="320" y2="900" />
    <line x1="500" y1="790" x2="500" y2="900" />
    <line x1="680" y1="790" x2="680" y2="900" />
    <line x1="860" y1="790" x2="860" y2="900" />
    <line x1="1060" y1="790" x2="1060" y2="900" />
    <line x1="1240" y1="790" x2="1240" y2="900" />
    <line x1="1420" y1="790" x2="1420" y2="900" />
    <line x1="1600" y1="790" x2="1600" y2="900" />
    <line x1="1780" y1="790" x2="1780" y2="900" />
  </g>

  <!-- Belfry High-Altitude Wood Plank Platform Floor -->
  <polygon points="0,1080 0,900 1920,900 1920,1080" fill="#0f0d0c" />
  <g stroke="#78350f" stroke-width="2" opacity="0.5">
    <line x1="0" y1="950" x2="1920" y2="950" />
    <line x1="0" y1="1010" x2="1920" y2="1010" />
    <line x1="0" y1="1070" x2="1920" y2="1070" />
    <line x1="380" y1="900" x2="380" y2="1080" />
    <line x1="760" y1="900" x2="760" y2="1080" />
    <line x1="1160" y1="900" x2="1160" y2="1080" />
    <line x1="1540" y1="900" x2="1540" y2="1080" />
  </g>
</svg>
