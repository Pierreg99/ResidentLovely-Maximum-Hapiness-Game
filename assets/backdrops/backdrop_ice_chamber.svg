<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="iceCaveSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#031326" />
      <stop offset="50%" stop-color="#082f49" />
      <stop offset="100%" stop-color="#021422" />
    </linearGradient>
    <linearGradient id="iceGlacier1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe" />
      <stop offset="40%" stop-color="#38bdf8" />
      <stop offset="80%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="iceGlacier2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a5f3fc" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0e7490" />
    </linearGradient>
    <radialGradient id="frostGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e0f2fe" stop-opacity="0.8" />
      <stop offset="45%" stop-color="#22d3ee" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#031326" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="frozenRiver" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#031326" stop-opacity="0.95" />
    </linearGradient>
    <filter id="iceBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Ice Cavern Background -->
  <rect width="1920" height="1080" fill="url(#iceCaveSky)" />

  <!-- Aurora Borealis Glow in Ice Dome Ceiling -->
  <g filter="url(#iceBlur)" opacity="0.65">
    <path d="M 0,220 Q 480,80 960,200 Q 1440,320 1920,120 L 1920,0 L 0,0 Z" fill="#22d3ee" />
    <path d="M 0,280 Q 560,140 1080,260 Q 1600,380 1920,200 L 1920,0 L 0,0 Z" fill="#a855f7" opacity="0.5" />
  </g>

  <!-- Massive Hanging Ice Stalactites (Ceiling) -->
  <g fill="url(#iceGlacier1)" stroke="#0284c7" stroke-width="2" filter="url(#iceBlur)">
    <!-- Group Left -->
    <polygon points="120,0 200,380 250,0" />
    <polygon points="230,0 290,460 340,0" fill="url(#iceGlacier2)" />
    <polygon points="320,0 380,290 420,0" />
    <polygon points="450,0 520,340 560,0" />

    <!-- Group Center -->
    <polygon points="760,0 820,260 870,0" />
    <polygon points="900,0 960,420 1020,0" fill="url(#iceGlacier2)" />
    <polygon points="1060,0 1120,300 1170,0" />

    <!-- Group Right -->
    <polygon points="1380,0 1440,320 1480,0" />
    <polygon points="1520,0 1580,480 1640,0" fill="url(#iceGlacier2)" />
    <polygon points="1670,0 1730,350 1780,0" />
  </g>

  <!-- Central Great Frozen Waterfall Pillar -->
  <g filter="url(#iceBlur)">
    <polygon points="880,180 1040,180 1090,820 830,820" fill="url(#iceGlacier2)" />
    <polygon points="920,180 1000,180 1030,820 890,820" fill="url(#iceGlacier1)" opacity="0.9" />
    <!-- Glacial Facets & Shimmer -->
    <line x1="960" y1="180" x2="960" y2="820" stroke="#ffffff" stroke-width="3" opacity="0.8" />
    <line x1="910" y1="280" x2="940" y2="760" stroke="#e0f2fe" stroke-width="2" opacity="0.7" />
    <line x1="1010" y1="280" x2="980" y2="760" stroke="#e0f2fe" stroke-width="2" opacity="0.7" />
    <circle cx="960" cy="500" r="180" fill="url(#frostGlow)" />
  </g>

  <!-- Rising Crystal Stalagmites from Ground (Left & Right Flanks) -->
  <g fill="url(#iceGlacier1)" stroke="#0c4a6e" stroke-width="2">
    <!-- Left Stalagmites -->
    <polygon points="40,1080 140,540 220,1080" />
    <polygon points="160,1080 240,640 320,1080" fill="url(#iceGlacier2)" />
    <polygon points="260,1080 340,720 400,1080" />

    <!-- Right Stalagmites -->
    <polygon points="1880,1080 1780,520 1700,1080" />
    <polygon points="1760,1080 1680,620 1600,1080" fill="url(#iceGlacier2)" />
    <polygon points="1660,1080 1580,700 1520,1080" />
  </g>

  <!-- Frozen Glacial River & Ice Sheet Floor -->
  <polygon points="0,1080 450,800 1470,800 1920,1080" fill="url(#frozenRiver)" />

  <!-- Dynamic Ice Crack Fractures on Floor -->
  <g stroke="#ffffff" stroke-width="2.5" fill="none" opacity="0.8" filter="url(#iceBlur)">
    <!-- Center Crack Spreading Outwards -->
    <path d="M 960,820 L 980,880 L 930,940 L 970,1000 L 940,1080" />
    <path d="M 980,880 L 1050,910 L 1120,960 L 1220,1080" />
    <path d="M 930,940 L 840,970 L 760,1030 L 680,1080" />
    <!-- Secondary Branching Fissures -->
    <path d="M 1050,910 L 1180,920 L 1320,950 L 1480,1080" stroke="#38bdf8" stroke-width="2" />
    <path d="M 840,970 L 720,980 L 580,1020 L 440,1080" stroke="#38bdf8" stroke-width="2" />
  </g>

  <!-- Frost Crystals Floating in Atmosphere -->
  <g fill="#ffffff" opacity="0.85">
    <circle cx="480" cy="460" r="3" />
    <circle cx="620" cy="380" r="2.5" />
    <circle cx="750" cy="520" r="3.5" />
    <circle cx="1180" cy="440" r="3" />
    <circle cx="1320" cy="500" r="2.5" />
    <circle cx="1460" cy="390" r="3.5" />
  </g>
</svg>
