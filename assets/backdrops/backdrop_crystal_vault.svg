<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <!-- NEXUS PRIVE v6.0 Crystal Vault Gradients -->
    <linearGradient id="vaultSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#05070a" />
      <stop offset="50%" stop-color="#1e1035" />
      <stop offset="100%" stop-color="#0a0518" />
    </linearGradient>
    <linearGradient id="crystalGlow1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#581c87" stop-opacity="0.3" />
    </linearGradient>
    <linearGradient id="crystalGlow2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#a78bfa" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#2e1065" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="pillarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <radialGradient id="vaultAura" cx="50%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#7c3aed" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#05070a" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="shardCore" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="40%" stop-color="#c084fc" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#7e22ce" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="floorGrid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#05070a" stop-opacity="0.9" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1920" height="1080" fill="url(#vaultSky)" />

  <!-- Center Vault Atmospheric Aura -->
  <circle cx="960" cy="540" r="650" fill="url(#vaultAura)" />

  <!-- Background Vault Arch Architecture -->
  <g stroke="#3b0764" stroke-width="3" fill="none" opacity="0.6">
    <path d="M 300,1080 L 300,400 Q 960,50 1620,400 L 1620,1080" />
    <path d="M 450,1080 L 450,480 Q 960,180 1470,480 L 1470,1080" />
    <path d="M 600,1080 L 600,560 Q 960,300 1320,560 L 1320,1080" />
  </g>

  <!-- Distant Geode Formations -->
  <g fill="url(#crystalGlow1)" opacity="0.5">
    <polygon points="200,600 240,420 280,620 250,650" />
    <polygon points="350,650 380,480 430,670 400,700" />
    <polygon points="1550,620 1590,440 1640,640 1600,680" />
    <polygon points="1680,660 1720,500 1770,680 1730,710" />
  </g>

  <!-- Foreground Massive Crystal Spires (Left & Right) -->
  <g filter="url(#glow)">
    <!-- Left Giant Cluster -->
    <polygon points="80,1080 180,320 280,480 240,1080" fill="url(#crystalGlow1)" />
    <polygon points="180,320 280,480 230,1080 160,1080" fill="url(#crystalGlow2)" opacity="0.8" />
    <polygon points="220,1080 320,450 390,620 340,1080" fill="url(#crystalGlow1)" />
    <polygon points="30,1080 110,520 180,680 140,1080" fill="url(#crystalGlow2)" />

    <!-- Right Giant Cluster -->
    <polygon points="1840,1080 1740,300 1640,470 1680,1080" fill="url(#crystalGlow1)" />
    <polygon points="1740,300 1640,470 1690,1080 1760,1080" fill="url(#crystalGlow2)" opacity="0.8" />
    <polygon points="1700,1080 1600,430 1530,600 1580,1080" fill="url(#crystalGlow1)" />
    <polygon points="1890,1080 1810,500 1740,660 1780,1080" fill="url(#crystalGlow2)" />
  </g>

  <!-- Central Great Floating Prismatic Monolith -->
  <g filter="url(#glow)">
    <polygon points="960,180 1060,520 960,860 860,520" fill="url(#crystalGlow2)" />
    <polygon points="960,180 1060,520 960,520" fill="#f3e8ff" opacity="0.85" />
    <polygon points="860,520 960,520 960,860" fill="#6b21a8" opacity="0.75" />
    <polygon points="960,520 1060,520 960,860" fill="#a855f7" opacity="0.9" />
    <circle cx="960" cy="520" r="140" fill="url(#shardCore)" />
  </g>

  <!-- Floating Minor Orbiting Shards -->
  <g fill="url(#crystalGlow1)" opacity="0.85" filter="url(#glow)">
    <polygon points="720,380 750,320 770,390 740,430" />
    <polygon points="1180,360 1210,290 1240,370 1200,420" />
    <polygon points="680,620 710,560 730,630 690,670" />
    <polygon points="1220,640 1250,580 1270,650 1230,690" />
    <polygon points="960,110 980,70 1000,120 970,140" />
  </g>

  <!-- Floor Perspective Grid & Sanctuary Pedestal -->
  <path d="M 0,1080 L 700,750 L 1220,750 L 1920,1080 Z" fill="url(#floorGrid)" opacity="0.7" />
  <g stroke="#c084fc" stroke-width="1.5" opacity="0.4">
    <line x1="960" y1="750" x2="960" y2="1080" />
    <line x1="860" y1="750" x2="680" y2="1080" />
    <line x1="1060" y1="750" x2="1240" y2="1080" />
    <line x1="760" y1="750" x2="400" y2="1080" />
    <line x1="1160" y1="750" x2="1520" y2="1080" />
    <line x1="720" y1="820" x2="1200" y2="820" />
    <line x1="620" y1="910" x2="1300" y2="910" />
    <line x1="500" y1="1010" x2="1420" y2="1010" />
  </g>

  <!-- Runed Pedestal Base -->
  <polygon points="820,800 1100,800 1160,860 760,860" fill="#1e1b4b" stroke="#a78bfa" stroke-width="2" />
  <polygon points="760,860 1160,860 1200,920 720,920" fill="#0f172a" stroke="#7c3aed" stroke-width="2" />

  <!-- Stardust & Light Motifs -->
  <g fill="#ffffff" opacity="0.8">
    <circle cx="500" cy="300" r="2.5" />
    <circle cx="650" cy="220" r="1.5" />
    <circle cx="820" cy="310" r="2" />
    <circle cx="1120" cy="240" r="2.5" />
    <circle cx="1340" cy="320" r="1.5" />
    <circle cx="1480" cy="210" r="3" />
    <circle cx="960" cy="280" r="3" />
    <circle cx="920" cy="430" r="2" />
    <circle cx="1010" cy="460" r="2.5" />
  </g>

  <!-- Vignette Feathering Border Overlay -->
  <rect width="1920" height="1080" fill="none" stroke="#05070a" stroke-width="40" opacity="0.4" />
</svg>
