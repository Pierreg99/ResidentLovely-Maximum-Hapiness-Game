<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="stormSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020817" />
      <stop offset="40%" stop-color="#0f2137" />
      <stop offset="75%" stop-color="#034870" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <radialGradient id="fresnelCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="25%" stop-color="#fef08a" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="spotlightBeam" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.9" />
      <stop offset="20%" stop-color="#fde047" stop-opacity="0.6" />
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="ironDeck" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <filter id="lensGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Stormy Maritime Night Sky -->
  <rect width="1920" height="720" fill="url(#stormSky)" />

  <!-- Sweeping Lighthouse Spotlight Beams (Across Left & Right) -->
  <g opacity="0.85">
    <!-- Main Sweeping Right Beam -->
    <polygon points="960,320 1920,120 1920,440" fill="url(#spotlightBeam)" />
    <!-- Secondary Sweeping Left Beam -->
    <polygon points="960,320 0,180 0,480" fill="url(#spotlightBeam)" transform="scale(-1, 1) translate(-1920, 0)" opacity="0.6" />
  </g>

  <!-- Distant Ocean Waves Horizon -->
  <path d="M 0,640 Q 480,620 960,635 Q 1440,615 1920,640 L 1920,720 L 0,720 Z" fill="#032642" />

  <!-- Giant Fresnel Lens Rotating Assembly (Center Lantern Room) -->
  <!-- Outer Brass Lantern Housing -->
  <g filter="url(#lensGlow)">
    <!-- Giant Concentric Prismatic Rings of the Fresnel Lens -->
    <circle cx="960" cy="320" r="170" fill="none" stroke="#f59e0b" stroke-width="8" />
    <circle cx="960" cy="320" r="140" fill="none" stroke="#fef08a" stroke-width="6" />
    <circle cx="960" cy="320" r="110" fill="none" stroke="#ffffff" stroke-width="5" />
    <circle cx="960" cy="320" r="80" fill="none" stroke="#38bdf8" stroke-width="4" />
    
    <!-- Central Brilliant Lamp Core -->
    <circle cx="960" cy="320" r="140" fill="url(#fresnelCore)" />
    <circle cx="960" cy="320" r="45" fill="#ffffff" />
  </g>

  <!-- Brass Pedestal & Clockwork Rotation Mechanism for Lens -->
  <polygon points="860,460 1060,460 1090,680 830,680" fill="#1e293b" stroke="#f59e0b" stroke-width="3" />
  <rect x="880" y="520" width="160" height="20" fill="#d97706" />
  <circle cx="960" cy="590" r="30" fill="#0f172a" stroke="#f59e0b" stroke-width="3" />

  <!-- Glass Lantern Room Framing Struts & Dome Structure -->
  <g stroke="#0f172a" stroke-width="12" fill="none">
    <!-- Vertical Struts -->
    <line x1="680" y1="0" x2="680" y2="720" />
    <line x1="1240" y1="0" x2="1240" y2="720" />
    <!-- Diagonal Braces -->
    <line x1="680" y1="100" x2="1240" y2="600" opacity="0.7" />
    <line x1="1240" y1="100" x2="680" y2="600" opacity="0.7" />
    <!-- Top Gallery Roof Trim -->
    <line x1="0" y1="80" x2="1920" y2="80" stroke-width="16" />
  </g>

  <!-- Cast-Iron Lighthouse Balcony Railing (Midground) -->
  <rect x="0" y="680" width="1920" height="24" fill="#0f172a" stroke="#334155" stroke-width="2" />
  
  <!-- Railing Posts & Iron Cross-Bracing -->
  <g stroke="#1e293b" stroke-width="4" fill="none">
    <!-- Stanchions -->
    <line x1="120" y1="704" x2="120" y2="840" />
    <line x1="280" y1="704" x2="280" y2="840" />
    <line x1="440" y1="704" x2="440" y2="840" />
    <line x1="600" y1="704" x2="600" y2="840" />
    <line x1="760" y1="704" x2="760" y2="840" />
    <line x1="920" y1="704" x2="920" y2="840" />
    <line x1="1000" y1="704" x2="1000" y2="840" />
    <line x1="1160" y1="704" x2="1160" y2="840" />
    <line x1="1320" y1="704" x2="1320" y2="840" />
    <line x1="1480" y1="704" x2="1480" y2="840" />
    <line x1="1640" y1="704" x2="1640" y2="840" />
    <line x1="1800" y1="704" x2="1800" y2="840" />
  </g>

  <!-- Circular Iron Deck Floor & Diamond Plate Treads -->
  <polygon points="0,1080 0,840 1920,840 1920,1080" fill="url(#ironDeck)" />
  <g stroke="#0284c7" stroke-width="1.5" opacity="0.35">
    <line x1="960" y1="840" x2="960" y2="1080" />
    <line x1="720" y1="840" x2="480" y2="1080" />
    <line x1="1200" y1="840" x2="1440" y2="1080" />
    <line x1="480" y1="840" x2="0" y2="1080" />
    <line x1="1440" y1="840" x2="1920" y2="1080" />
    <line x1="0" y1="910" x2="1920" y2="910" />
    <line x1="0" y1="980" x2="1920" y2="980" />
    <line x1="0" y1="1050" x2="1920" y2="1050" />
  </g>

  <!-- Brass Compass Binnacle & Navigation Instrument (Deck Foreground) -->
  <g fill="#1e293b" stroke="#f59e0b" stroke-width="2">
    <polygon points="900,900 1020,900 1040,1040 880,1040" fill="#0f172a" />
    <circle cx="960" cy="890" r="35" fill="none" stroke="#f59e0b" stroke-width="3" />
    <polygon points="960,865 968,890 960,915 952,890" fill="#ef4444" stroke="#f59e0b" stroke-width="1" />
  </g>
</svg>
