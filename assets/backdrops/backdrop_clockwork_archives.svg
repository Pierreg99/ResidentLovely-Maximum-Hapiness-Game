<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="archiveWall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#162032" />
      <stop offset="100%" stop-color="#060913" />
    </linearGradient>
    <linearGradient id="brassGear1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <linearGradient id="brassGear2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0c4a6e" />
    </linearGradient>
    <radialGradient id="clockGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.9" />
      <stop offset="35%" stop-color="#f59e0b" stop-opacity="0.5" />
      <stop offset="70%" stop-color="#22d3ee" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#0a0f1d" stop-opacity="0" />
    </radialGradient>
    <filter id="gearGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Wall Background -->
  <rect width="1920" height="1080" fill="url(#archiveWall)" />

  <!-- Giant Background Clock Face & Golden Escapement -->
  <g filter="url(#gearGlow)">
    <circle cx="960" cy="420" r="340" fill="url(#clockGlow)" />
    <circle cx="960" cy="420" r="300" fill="#0f172a" stroke="url(#brassGear1)" stroke-width="8" />
    <circle cx="960" cy="420" r="280" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="8 12" />

    <!-- Roman Numerals / Hour Markers -->
    <g stroke="url(#brassGear1)" stroke-width="4" stroke-linecap="round">
      <line x1="960" y1="150" x2="960" y2="180" /> <!-- XII -->
      <line x1="960" y1="660" x2="960" y2="690" /> <!-- VI -->
      <line x1="690" y1="420" x2="720" y2="420" /> <!-- IX -->
      <line x1="1200" y1="420" x2="1230" y2="420" /> <!-- III -->
    </g>

    <!-- Clock Hands -->
    <line x1="960" y1="420" x2="960" y2="240" stroke="url(#brassGear1)" stroke-width="8" stroke-linecap="round" />
    <line x1="960" y1="420" x2="1120" y2="420" stroke="url(#brassGear1)" stroke-width="6" stroke-linecap="round" />
    <circle cx="960" cy="420" r="24" fill="#fef08a" stroke="#d97706" stroke-width="4" />
  </g>

  <!-- Giant Interlocking Gears (Left Flank) -->
  <g fill="none" stroke="url(#brassGear1)" stroke-width="12" filter="url(#gearGlow)">
    <!-- Gear 1 -->
    <circle cx="340" cy="300" r="160" stroke-dasharray="24 16" />
    <circle cx="340" cy="300" r="90" stroke="url(#brassGear2)" stroke-width="8" />
    <!-- Spokes -->
    <line x1="180" y1="300" x2="500" y2="300" stroke-width="6" />
    <line x1="340" y1="140" x2="340" y2="460" stroke-width="6" />

    <!-- Gear 2 (Lower Left) -->
    <circle cx="200" cy="540" r="130" stroke-dasharray="20 14" stroke="url(#brassGear2)" stroke-width="10" />
    <circle cx="200" cy="540" r="60" stroke-width="6" />
  </g>

  <!-- Giant Interlocking Gears (Right Flank) -->
  <g fill="none" stroke="url(#brassGear1)" stroke-width="12" filter="url(#gearGlow)">
    <!-- Gear 3 -->
    <circle cx="1580" cy="300" r="160" stroke-dasharray="24 16" />
    <circle cx="1580" cy="300" r="90" stroke="url(#brassGear2)" stroke-width="8" />
    <line x1="1420" y1="300" x2="1740" y2="300" stroke-width="6" />
    <line x1="1580" y1="140" x2="1580" y2="460" stroke-width="6" />

    <!-- Gear 4 (Lower Right) -->
    <circle cx="1720" cy="540" r="130" stroke-dasharray="20 14" stroke="url(#brassGear2)" stroke-width="10" />
    <circle cx="1720" cy="540" r="60" stroke-width="6" />
  </g>

  <!-- Towering Library Archive Bookshelves (Left & Right Wings) -->
  <!-- Left Bookshelf -->
  <g fill="#1e1b4b" stroke="#0f172a" stroke-width="3">
    <rect x="0" y="200" width="180" height="880" fill="#0f172a" />
    <!-- Shelves & Tomes -->
    <rect x="10" y="280" width="160" height="15" fill="url(#brassGear1)" />
    <rect x="20" y="210" width="22" height="70" fill="#dc2626" />
    <rect x="45" y="220" width="18" height="60" fill="#0284c7" />
    <rect x="66" y="205" width="26" height="75" fill="#f59e0b" />
    <rect x="95" y="215" width="20" height="65" fill="#10b981" />
    <rect x="118" y="208" width="24" height="72" fill="#7c3aed" />

    <rect x="10" y="440" width="160" height="15" fill="url(#brassGear1)" />
    <rect x="20" y="370" width="25" height="70" fill="#0284c7" />
    <rect x="48" y="360" width="30" height="80" fill="#f59e0b" />
    <rect x="81" y="375" width="20" height="65" fill="#dc2626" />
    <rect x="104" y="365" width="26" height="75" fill="#10b981" />

    <rect x="10" y="600" width="160" height="15" fill="url(#brassGear1)" />
    <rect x="10" y="760" width="160" height="15" fill="url(#brassGear1)" />
  </g>

  <!-- Right Bookshelf -->
  <g fill="#1e1b4b" stroke="#0f172a" stroke-width="3">
    <rect x="1740" y="200" width="180" height="880" fill="#0f172a" />
    <rect x="1750" y="280" width="160" height="15" fill="url(#brassGear1)" />
    <rect x="1760" y="210" width="24" height="70" fill="#7c3aed" />
    <rect x="1787" y="218" width="18" height="62" fill="#0284c7" />
    <rect x="1808" y="205" width="28" height="75" fill="#f59e0b" />
    <rect x="1839" y="212" width="22" height="68" fill="#10b981" />

    <rect x="1750" y="440" width="160" height="15" fill="url(#brassGear1)" />
    <rect x="1750" y="600" width="160" height="15" fill="url(#brassGear1)" />
    <rect x="1750" y="760" width="160" height="15" fill="url(#brassGear1)" />
  </g>

  <!-- Polished Parquet Archive Floor -->
  <polygon points="0,1080 350,780 1570,780 1920,1080" fill="#090d16" />
  <g stroke="#22d3ee" stroke-width="1.5" opacity="0.35">
    <line x1="960" y1="780" x2="960" y2="1080" />
    <line x1="750" y1="780" x2="520" y2="1080" />
    <line x1="1170" y1="780" x2="1400" y2="1080" />
    <line x1="500" y1="850" x2="1420" y2="850" />
    <line x1="420" y1="940" x2="1500" y2="940" />
    <line x1="280" y1="1020" x2="1640" y2="1020" />
  </g>

  <!-- Brass Astrolabe / Grand Harpsichord Center Silhouette -->
  <g fill="#1e293b" stroke="url(#brassGear1)" stroke-width="2">
    <!-- Center Desk -->
    <polygon points="760,840 1160,840 1220,930 700,930" fill="#0f172a" />
    <!-- Brass Armillary / Globe on Desk -->
    <circle cx="960" cy="800" r="35" fill="none" stroke="url(#brassGear1)" stroke-width="3" />
    <ellipse cx="960" cy="800" rx="35" ry="12" fill="none" stroke="url(#brassGear1)" stroke-width="2" />
    <line x1="960" y1="760" x2="960" y2="840" stroke="url(#brassGear1)" stroke-width="3" />
  </g>
</svg>
