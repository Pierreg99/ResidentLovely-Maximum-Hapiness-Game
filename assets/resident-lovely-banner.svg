<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.8"/>
      <stop offset="45%" stop-color="#0b1120" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#05070a" stop-opacity="1"/>
    </radialGradient>

    <!-- Cyan Glow Filter -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Gold Glow Filter -->
    <filter id="glowGold" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Magenta Glow Filter -->
    <filter id="glowMagenta" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(34, 211, 238, 0.08)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="500" fill="url(#bgGlow)" />
  <rect width="1200" height="500" fill="url(#grid)" />

  <!-- Outer Border -->
  <rect x="15" y="15" width="1170" height="470" rx="12" fill="none" stroke="rgba(34, 211, 238, 0.3)" stroke-width="2" />
  <rect x="25" y="25" width="1150" height="450" rx="8" fill="none" stroke="rgba(245, 158, 11, 0.25)" stroke-width="1" />

  <!-- Top Badges -->
  <g transform="translate(60, 60)">
    <!-- Badge 1: S.M.I.L.E. Tactical -->
    <rect x="0" y="0" width="170" height="28" rx="14" fill="rgba(15, 23, 42, 0.8)" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="85" y="18" fill="#22d3ee" font-family="'SF Mono', 'Courier New', monospace" font-size="11" font-weight="bold" text-anchor="middle">❖ S.M.I.L.E. ALPHA TEAM</text>

    <!-- Badge 2: Zero Emoji -->
    <rect x="185" y="0" width="160" height="28" rx="14" fill="rgba(15, 23, 42, 0.8)" stroke="#ec4899" stroke-width="1.5"/>
    <text x="265" y="18" fill="#ec4899" font-family="'SF Mono', 'Courier New', monospace" font-size="11" font-weight="bold" text-anchor="middle">★ ZERO EMOJI STANDARD</text>

    <!-- Badge 3: WebGL 3D -->
    <rect x="360" y="0" width="150" height="28" rx="14" fill="rgba(15, 23, 42, 0.8)" stroke="#10b981" stroke-width="1.5"/>
    <text x="435" y="18" fill="#10b981" font-family="'SF Mono', 'Courier New', monospace" font-size="11" font-weight="bold" text-anchor="middle">▶ THREE.JS 3D ENGINE</text>
  </g>

  <!-- Main Title -->
  <g transform="translate(60, 150)">
    <text x="0" y="0" fill="#22d3ee" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="56" font-weight="900" letter-spacing="4" filter="url(#glowCyan)">RESIDENT LOVELY</text>
    <text x="0" y="38" fill="#f59e0b" font-family="'SF Mono', 'Courier New', monospace" font-size="16" font-weight="800" letter-spacing="3" filter="url(#glowGold)">MAXIMUM HAPPINESS 3D SURVIVAL-JOY ADVENTURE</text>
    <text x="0" y="68" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500">A Wholesome Parody of Classic Survival-Horror in Château de la Joie</text>
  </g>

  <!-- ECG Joy Vitality Line -->
  <g transform="translate(60, 260)">
    <rect x="0" y="0" width="450" height="60" rx="8" fill="rgba(10, 15, 26, 0.8)" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1.5"/>
    <path d="M 15 30 L 100 30 L 120 10 L 140 50 L 160 15 L 180 40 L 200 30 L 435 30" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#glowCyan)"/>
    <text x="320" y="22" fill="#10b981" font-family="'SF Mono', monospace" font-size="10" font-weight="bold">VITALITY: 100% MAX BLISS</text>
  </g>

  <!-- 4 Weapon Cards Cluster -->
  <g transform="translate(60, 350)">
    <!-- Card 1: Pistol -->
    <rect x="0" y="0" width="115" height="80" rx="8" fill="rgba(15, 23, 42, 0.7)" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="57" y="26" fill="#22d3ee" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">[1] PISTOL</text>
    <text x="57" y="44" fill="#94a3b8" font-family="monospace" font-size="8" text-anchor="middle">Confetti Darts</text>
    <circle cx="57" cy="62" r="4" fill="#22d3ee"/>

    <!-- Card 2: Bubble -->
    <rect x="125" y="0" width="115" height="80" rx="8" fill="rgba(15, 23, 42, 0.7)" stroke="#ec4899" stroke-width="1.5"/>
    <text x="182" y="26" fill="#ec4899" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">[2] BUBBLE</text>
    <text x="182" y="44" fill="#94a3b8" font-family="monospace" font-size="8" text-anchor="middle">Trap Grumps</text>
    <circle cx="182" cy="62" r="4" fill="#ec4899"/>

    <!-- Card 3: Mortar -->
    <rect x="250" y="0" width="115" height="80" rx="8" fill="rgba(15, 23, 42, 0.7)" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="307" y="26" fill="#f59e0b" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">[3] MORTAR</text>
    <text x="307" y="44" fill="#94a3b8" font-family="monospace" font-size="8" text-anchor="middle">360° Blast</text>
    <circle cx="307" cy="62" r="4" fill="#f59e0b"/>

    <!-- Card 4: Joy Beam -->
    <rect x="375" y="0" width="115" height="80" rx="8" fill="rgba(15, 23, 42, 0.7)" stroke="#a855f7" stroke-width="1.5"/>
    <text x="432" y="26" fill="#a855f7" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">[4] BEAM</text>
    <text x="432" y="44" fill="#94a3b8" font-family="monospace" font-size="8" text-anchor="middle">Continuous Laser</text>
    <circle cx="432" cy="62" r="4" fill="#a855f7"/>
  </g>

  <!-- Right Visual: 3D Château Isometric Blueprint Artwork -->
  <g transform="translate(680, 80)">
    <!-- Manor Schematic Outline -->
    <polygon points="250,50 450,150 250,250 50,150" fill="rgba(30, 27, 75, 0.4)" stroke="#22d3ee" stroke-width="2.5" filter="url(#glowCyan)"/>
    <polygon points="50,150 250,250 250,340 50,240" fill="rgba(15, 23, 42, 0.6)" stroke="#22d3ee" stroke-width="2"/>
    <polygon points="450,150 250,250 250,340 450,240" fill="rgba(10, 15, 26, 0.8)" stroke="#22d3ee" stroke-width="2"/>

    <!-- East Wing Library Projection -->
    <polygon points="410,130 500,175 420,215 330,170" fill="rgba(245, 158, 11, 0.2)" stroke="#f59e0b" stroke-width="2" filter="url(#glowGold)"/>

    <!-- West Wing Solarium Garden Projection -->
    <polygon points="90,130 170,170 90,210 10,170" fill="rgba(16, 185, 129, 0.2)" stroke="#10b981" stroke-width="2"/>

    <!-- Center Spire Chandelier -->
    <line x1="250" y1="50" x2="250" y2="170" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 4"/>
    <circle cx="250" cy="170" r="12" fill="#f59e0b" filter="url(#glowGold)"/>
    <circle cx="250" cy="170" r="6" fill="#ffffff"/>

    <!-- Animated Sparkles / Confetti Dots -->
    <circle cx="200" cy="90" r="4" fill="#ec4899" filter="url(#glowMagenta)"/>
    <circle cx="320" cy="80" r="5" fill="#22d3ee" filter="url(#glowCyan)"/>
    <circle cx="280" cy="120" r="3" fill="#10b981"/>
    <circle cx="160" cy="190" r="4" fill="#f59e0b"/>
    <circle cx="360" cy="180" r="5" fill="#a855f7"/>
    <circle cx="240" cy="230" r="4" fill="#ec4899"/>
    <circle cx="180" cy="260" r="3" fill="#22d3ee"/>
    <circle cx="300" cy="270" r="4" fill="#10b981"/>

    <!-- Map Label -->
    <rect x="150" y="320" width="200" height="30" rx="15" fill="rgba(5, 7, 10, 0.9)" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="250" y="340" fill="#22d3ee" font-family="'SF Mono', monospace" font-size="11" font-weight="bold" text-anchor="middle">◈ CHÂTEAU DE LA JOIE</text>
  </g>
</svg>
